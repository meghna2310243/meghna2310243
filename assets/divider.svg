<svg width="100%" height="4" viewBox="0 0 800 4" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#2c5364"/>
      <stop offset="100%" stop-color="#0f2027"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6dd5ed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6dd5ed" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6dd5ed" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="4" fill="url(#base)"/>
  <rect width="200" height="4" fill="url(#shimmer)">
    <animate attributeName="x" from="-200" to="800" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
